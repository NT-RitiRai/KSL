<section class="contact-form" id="contact-form">
  <div class="container">
    <div class="contact-form__panel">
      <div class="contact-form__fields">
        <h2 class="contact-form__title">Get in Touch</h2>
        <p class="contact-form__desc">Fill out the form below and we&rsquo;ll get back to you as soon as possible.</p>

        <form class="contact-form__form">
          <div class="contact-form__field">
            <label for="contactName">Name</label>
            <input type="text" id="contactName" name="name" placeholder="John Doe" />
          </div>

          <div class="contact-form__row">
            <div class="contact-form__field">
              <label for="contactPhone">Contact Number</label>
              <div class="contact-form__phone">
                <span>+91</span>
                <input type="tel" id="contactPhone" name="phone" placeholder="97097079998" />
              </div>
            </div>
            <div class="contact-form__field">
              <label for="contactEmail">Email ID</label>
              <input type="email" id="contactEmail" name="email" placeholder="abc@gmail.com" />
            </div>
          </div>

          <div class="contact-form__field">
            <label for="contactSubject">Subject</label>
            <select id="contactSubject" name="subject">
              <option value="" selected disabled>How can we help?</option>
              <option value="equity-broking">Equity Broking</option>
              <option value="derivatives">Derivatives Trading</option>
              <option value="research">Equity Research</option>
              <option value="other">Something else</option>
            </select>
          </div>

          <button type="submit" class="contact-form__submit">Submit</button>
        </form>
      </div>

      <div class="contact-form__visual">
        <iframe class="map-embed" src="https://maps.google.com/maps?q=Khandwala+Securities+Limited,+G-II+Ground+Floor,+Dalamal+House,+Nariman+Point,+Mumbai,+Maharashtra+400021@18.9239071,72.8208294&z=17&hl=en&output=embed"
          title="Map showing Khandwala Securities Limited's registered office at Dalamal House, Nariman Point, Mumbai"
          loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
      </div>
    </div>
  </div>
</section>
